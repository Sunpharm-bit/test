<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>隆莱英语提升学习助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #27ae60;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --light-color: #ecf0f1;
            --dark-color: #2c3e50;
            --gray-color: #7f8c8d;
            --border-radius: 4px;
            --box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            --transition: all 0.15s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-color: #f5f7fa;
            color: var(--dark-color);
            line-height: 1.3;
            min-height: 100vh;
            padding: 0;
            font-size: 13px;
        }
        
        /* 应用容器 */
        .app-container {
            max-width: 100%;
            margin: 0 auto;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 顶部导航栏 - 极致紧凑 */
        .app-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, #34495e 100%);
            color: white;
            padding: 8px 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .app-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .app-title i {
            font-size: 0.9rem;
        }
        
        .app-subtitle {
            font-size: 0.7rem;
            opacity: 0.9;
            margin-top: 1px;
        }
        
        .word-count {
            font-size: 0.7rem;
            background: rgba(255,255,255,0.2);
            padding: 1px 5px;
            border-radius: 8px;
        }
        
        /* 紧凑选项卡导航 - 紧贴标题栏 */
        .tab-nav {
            display: flex;
            background-color: #f0f2f5;
            border-radius: 0;
            margin-bottom: 10px;
            padding: 0;
            position: sticky;
            top: 48px;
            z-index: 10;
        }
        
        .tab-button {
            flex: 1;
            padding: 8px 3px;
            text-align: center;
            border: none;
            background: transparent;
            font-weight: 600;
            color: var(--gray-color);
            border-radius: 0;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.75rem;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
        }
        
        .tab-button.active {
            background-color: white;
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
        }
        
        /* 主内容区 - 最小化留白 */
        .main-content {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        /* 选项卡内容 */
        .tab-content {
            display: none;
            padding-bottom: 5px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* 极致紧凑卡片样式 */
        .card {
            background-color: white;
            border-radius: var(--border-radius);
            padding: 10px;
            margin-bottom: 10px;
            box-shadow: var(--box-shadow);
        }
        
        .card-title {
            font-size: 0.9rem;
            color: var(--dark-color);
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--secondary-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .card-title i {
            color: var(--secondary-color);
            margin-right: 4px;
        }
        
        /* 极致紧凑表单样式 */
        .form-group {
            margin-bottom: 8px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 3px;
            font-weight: 600;
            color: var(--dark-color);
            font-size: 0.8rem;
        }
        
        .form-input {
            width: 100%;
            padding: 7px 8px;
            border: 1px solid #e1e5eb;
            border-radius: 3px;
            font-size: 0.8rem;
            transition: var(--transition);
            background-color: #f9fafc;
        }
        
        .form-input:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 0 1px rgba(52, 152, 219, 0.15);
            background-color: white;
        }
        
        .form-select {
            width: 100%;
            padding: 7px 8px;
            border: 1px solid #e1e5eb;
            border-radius: 3px;
            font-size: 0.8rem;
            background-color: #f9fafc;
            color: var(--dark-color);
        }
        
        /* 紧凑按钮样式 */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px;
            border: none;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--secondary-color) 0%, #2980b9 100%);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, var(--accent-color) 0%, #219653 100%);
            color: white;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, var(--gray-color) 0%, #5d6d7e 100%);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, var(--danger-color) 0%, #c0392b 100%);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, var(--warning-color) 0%, #d68910 100%);
            color: white;
        }
        
        .btn-sm {
            padding: 4px 6px;
            font-size: 0.7rem;
            width: auto;
            border-radius: 2px;
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        /* 单词列表 */
        .word-list-container {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 5px;
            -webkit-overflow-scrolling: touch;
            border: 1px solid #eee;
            border-radius: 3px;
        }
        
        .word-item {
            padding: 8px 10px;
            border-bottom: 1px solid #f0f0f0;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        
        .word-item:last-child {
            border-bottom: none;
        }
        
        .word-item.active {
            background-color: #f0f9ff;
            border-left: 2px solid var(--secondary-color);
        }
        
        .word-item.highlight {
            background-color: #fffacd;
            border-left: 2px solid var(--warning-color);
            animation: highlight-pulse 2s infinite;
        }
        
        .word-item.speaking {
            background-color: #e8f4fc;
        }
        
        .word-info {
            flex: 1;
            min-width: 0;
        }
        
        .word-english {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--dark-color);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .word-chinese {
            font-size: 0.8rem;
            color: var(--gray-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .word-category {
            font-size: 0.6rem;
            color: white;
            background-color: var(--primary-color);
            padding: 1px 4px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 3px;
        }
        
        .word-actions {
            display: flex;
            gap: 4px;
        }
        
        /* 输入练习区域 */
        .input-practice-section {
            padding: 12px 10px;
            background: linear-gradient(135deg, #f8f9ff 0%, #eef2ff 100%);
            border-radius: var(--border-radius);
            margin-bottom: 10px;
            box-shadow: var(--box-shadow);
        }
        
        /* 练习区域 - 修改为练习模式 */
        .practice-area {
            padding: 12px 10px;
            background: linear-gradient(135deg, #f8f9ff 0%, #eef2ff 100%);
            border-radius: var(--border-radius);
            margin-bottom: 10px;
            box-shadow: var(--box-shadow);
        }
        
        .practice-english {
            font-size: 1.3rem;
            color: var(--dark-color);
            margin-bottom: 8px;
            font-weight: 700;
            word-break: break-word;
            min-height: 30px;
        }
        
        .practice-chinese {
            font-size: 0.9rem;
            color: var(--secondary-color);
            margin-bottom: 6px;
            min-height: 20px;
            display: none;
        }
        
        .practice-chinese.show {
            display: block;
        }
        
        .practice-category {
            font-size: 0.7rem;
            color: var(--accent-color);
            background-color: rgba(39, 174, 96, 0.1);
            padding: 2px 6px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 8px;
        }
        
        /* 练习控制按钮 */
        .practice-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .practice-btn {
            padding: 10px 5px;
            font-size: 0.8rem;
        }
        
        /* 练习模式选择 */
        .practice-mode-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .mode-btn {
            padding: 8px 5px;
            border: none;
            border-radius: 3px;
            background-color: #f0f2f5;
            color: var(--dark-color);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .mode-btn.active {
            background-color: var(--secondary-color);
            color: white;
        }
        
        /* 练习统计信息 */
        .practice-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 5px;
            background-color: #f8f9fa;
            border-radius: 3px;
            margin-top: 10px;
            font-size: 0.75rem;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        
        .stat-value {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 0.9rem;
        }
        
        .stat-label {
            color: var(--gray-color);
            margin-top: 2px;
            font-size: 0.7rem;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 20px 10px;
            color: var(--gray-color);
        }
        
        .empty-state i {
            font-size: 1.8rem;
            margin-bottom: 6px;
            opacity: 0.5;
        }
        
        .empty-state p {
            font-size: 0.8rem;
        }
        
        /* 语音选择 */
        .voice-selector {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #eee;
        }
        
        .voice-select {
            width: 100%;
            padding: 7px 8px;
            border: 1px solid #e1e5eb;
            border-radius: 3px;
            font-size: 0.8rem;
            background-color: #f9fafc;
            margin-top: 3px;
        }
        
        /* 分类筛选 */
        .category-filter {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 10px;
        }
        
        .category-btn {
            padding: 5px 3px;
            border: none;
            border-radius: 3px;
            font-size: 0.7rem;
            background-color: #f0f2f5;
            color: var(--dark-color);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .category-btn.active {
            background-color: var(--secondary-color);
            color: white;
        }
        
        /* 搜索框样式 */
        .search-container {
            margin-bottom: 10px;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 8px 32px 8px 10px;
            border: 1px solid #e1e5eb;
            border-radius: 3px;
            font-size: 0.8rem;
            transition: var(--transition);
            background-color: #f9fafc;
        }
        
        .search-input:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 0 1px rgba(52, 152, 219, 0.15);
            background-color: white;
        }
        
        .search-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-color);
            pointer-events: none;
        }
        
        .clear-search-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-color);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px;
            display: none;
        }
        
        .clear-search-btn:hover {
            color: var(--danger-color);
        }
        
        /* 紧凑提示信息 */
        .hint {
            background-color: #e8f4fc;
            padding: 8px;
            border-radius: 3px;
            margin-top: 10px;
            border-left: 2px solid var(--secondary-color);
            font-size: 0.75rem;
        }
        
        .hint-title {
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
        }
        
        .hint-title i {
            margin-right: 4px;
            color: var(--secondary-color);
        }
        
        /* 语音动画 */
        .speaking {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { background-color: #e8f4fc; }
            50% { background-color: #d4e7fa; }
            100% { background-color: #e8f4fc; }
        }
        
        @keyframes highlight-pulse {
            0% { background-color: #fffacd; }
            50% { background-color: #fff176; }
            100% { background-color: #fffacd; }
        }
        
        /* 保存提示 */
        .save-notification {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--accent-color);
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            font-weight: 600;
            font-size: 0.8rem;
        }
        
        .save-notification.show {
            opacity: 1;
        }
        
        /* 练习结果样式 */
        .practice-result {
            padding: 10px;
            border-radius: 3px;
            font-size: 0.85rem;
        }
        
        .practice-result.correct {
            background-color: rgba(39, 174, 96, 0.1);
            border-left: 3px solid var(--accent-color);
            color: var(--accent-color);
        }
        
        .practice-result.incorrect {
            background-color: rgba(231, 76, 60, 0.1);
            border-left: 3px solid var(--danger-color);
            color: var(--danger-color);
        }
        
        .practice-result .correct-answer {
            font-weight: 700;
            margin-top: 5px;
        }
        
        /* 填空单词样式 */
        .blank-word {
            background-color: white;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #ddd;
            text-align: center;
            font-family: 'Courier New', monospace;
        }
        
        .blank-letter {
            color: var(--secondary-color);
            font-weight: 900;
        }
        
        .blank-space {
            color: var(--danger-color);
            display: inline-block;
            min-width: 20px;
            border-bottom: 2px solid var(--danger-color);
            margin: 0 2px;
            text-align: center;
        }
        
        /* 基础练习区域 */
        .basic-practice-section {
            margin-bottom: 15px;
        }
        
        /* 响应式调整 */
        @media (min-width: 768px) {
            .app-container {
                max-width: 420px;
                margin: 5px auto;
                min-height: calc(100vh - 10px);
                border-radius: 5px;
                overflow: hidden;
            }
        }
        
        /* 禁用状态 */
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* 分类练习统计 */
        .category-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        
        .category-count {
            font-size: 0.75rem;
            color: var(--gray-color);
        }
        
        /* 列表内发音指示 */
        .pronunciation-indicator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: var(--secondary-color);
            color: white;
            font-size: 0.6rem;
            margin-left: 5px;
            opacity: 0.8;
        }
        
        /* 收藏按钮 */
        .favorite-btn {
            color: #ffd700;
        }
        
        .favorite-btn.active {
            color: #ffd700;
        }
        
        /* 显示中文按钮 */
        .show-chinese-btn {
            margin-bottom: 10px;
        }
        
        /* 练习进度指示 */
        .practice-progress {
            font-size: 0.8rem;
            color: var(--gray-color);
            margin-top: 5px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        /* 复习按钮 */
        .review-favorites-btn {
            margin-top: 10px;
        }
        
        /* 系统术语标签 */
        .system-tag {
            font-size: 0.6rem;
            color: var(--secondary-color);
            margin-left: 4px;
            padding: 1px 3px;
            background-color: rgba(52, 152, 219, 0.1);
            border-radius: 3px;
        }
        
        /* 用户术语标签 */
        .user-tag {
            font-size: 0.6rem;
            color: var(--accent-color);
            margin-left: 4px;
            padding: 1px 3px;
            background-color: rgba(39, 174, 96, 0.1);
            border-radius: 3px;
        }
        
        /* 管理按钮组 */
        .management-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            margin-top: 10px;
        }
        
        /* 新练习模式按钮 */
        .mode-btn i {
            margin-right: 4px;
        }
        
        /* 加载指示器 */
        .loading-indicator {
            display: none;
            text-align: center;
            padding: 10px;
            color: var(--secondary-color);
        }
        
        .loading-indicator.active {
            display: block;
        }
        
        .loading-indicator i {
            margin-right: 5px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 签到相关样式 */
        .checkin-section {
            margin-top: 15px;
            padding: 12px 10px;
            background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
            border-radius: var(--border-radius);
            border: 1px solid #ffd54f;
        }
        
        .checkin-title {
            font-weight: 700;
            color: #ff9800;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        
        .checkin-title i {
            margin-right: 6px;
        }
        
        .checkin-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .checkin-stats {
            display: flex;
            gap: 15px;
        }
        
        .checkin-stat-item {
            text-align: center;
        }
        
        .checkin-stat-value {
            font-weight: 700;
            color: #f57c00;
            font-size: 1.2rem;
        }
        
        .checkin-stat-label {
            font-size: 0.7rem;
            color: #ff9800;
        }
        
        .checkin-btn {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 15px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .checkin-btn:active {
            transform: translateY(1px);
        }
        
        .checkin-btn:disabled {
            background: linear-gradient(135deg, #bdbdbd 0%, #9e9e9e 100%);
            cursor: not-allowed;
        }
        
        .checkin-record {
            margin-top: 8px;
            font-size: 0.75rem;
            color: #ff9800;
        }
        
        /* 发音测试区域 */
        .pronunciation-test {
            margin-top: 15px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: var(--border-radius);
            border: 1px solid #e9ecef;
        }
        
        .pronunciation-test h4 {
            margin-bottom: 8px;
            color: var(--dark-color);
            font-size: 0.9rem;
        }
        
        .pronunciation-test-controls {
            display: flex;
            gap: 5px;
        }
        
        .test-speech-btn {
            flex: 1;
            padding: 6px;
            font-size: 0.7rem;
        }
        
        /* 每月目标相关样式 */
        .monthly-goal-section {
            margin-top: 15px;
            padding: 12px 10px;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-radius: var(--border-radius);
            border: 1px solid #81c784;
        }
        
        .monthly-goal-title {
            font-weight: 700;
            color: #388e3c;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
