<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>隆莱英语提升学习助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #27ae60;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --light-color: #ecf0f1;
            --dark-color: #2c3e50;
            --gray-color: #7f8c8d;
            --border-radius: 4px;
            --box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            --transition: all 0.15s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-color: #f5f7fa;
            color: var(--dark-color);
            line-height: 1.3;
            min-height: 100vh;
            padding: 0;
            font-size: 13px;
        }
        
        /* 应用容器 */
        .app-container {
            max-width: 100%;
            margin: 0 auto;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 顶部导航栏 - 极致紧凑 */
        .app-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, #34495e 100%);
            color: white;
            padding: 8px 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .app-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .app-title i {
            font-size: 0.9rem;
        }
        
        .app-subtitle {
            font-size: 0.7rem;
            opacity: 0.9;
            margin-top: 1px;
        }
        
        .word-count {
            font-size: 0.7rem;
            background: rgba(255,255,255,0.2);
            padding: 1px 5px;
            border-radius: 8px;
        }
        
        /* 紧凑选项卡导航 - 紧贴标题栏 */
        .tab-nav {
            display: flex;
            background-color: #f0f2f5;
            border-radius: 0;
            margin-bottom: 10px;
            padding: 0;
            position: sticky;
            top: 48px;
            z-index: 10;
        }
        
        .tab-button {
            flex: 1;
            padding: 8px 3px;
            text-align: center;
            border: none;
            background: transparent;
            font-weight: 600;
            color: var(--gray-color);
            border-radius: 0;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.75rem;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
        }
        
        .tab-button.active {
            background-color: white;
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
        }
        
        /* 主内容区 - 最小化留白 */
        .main-content {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        /* 选项卡内容 */
        .tab-content {
            display: none;
            padding-bottom: 5px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* 极致紧凑卡片样式 */
        .card {
            background-color: white;
            border-radius: var(--border-radius);
            padding: 10px;
            margin-bottom: 10px;
            box-shadow: var(--box-shadow);
        }
        
        .card-title {
            font-size: 0.9rem;
            color: var(--dark-color);
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--secondary-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .card-title i {
            color: var(--secondary-color);
            margin-right: 4px;
        }
        
        /* 极致紧凑表单样式 */
        .form-group {
            margin-bottom: 8px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 3px;
            font-weight: 600;
            color: var(--dark-color);
            font-size: 0.8rem;
        }
        
        .form-input {
            width: 100%;
            padding: 7px 8px;
            border: 1px solid #e1e5eb;
            border-radius: 3px;
            font-size: 0.8rem;
            transition: var(--transition);
            background-color: #f9fafc;
        }
        
        .form-input:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 0 1px rgba(52, 152, 219, 0.15);
            background-color: white;
        }
        
        .form-select {
            width: 100%;
            padding: 7px 8px;
            border: 1px solid #e1e5eb;
            border-radius: 3px;
            font-size: 0.8rem;
            background-color: #f9fafc;
            color: var(--dark-color);
        }
        
        /* 紧凑按钮样式 */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px;
            border: none;
            border-radius: 3px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--secondary-color) 0%, #2980b9 100%);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, var(--accent-color) 0%, #219653 100%);
            color: white;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, var(--gray-color) 0%, #5d6d7e 100%);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, var(--danger-color) 0%, #c0392b 100%);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, var(--warning-color) 0%, #d68910 100%);
            color: white;
        }
        
        .btn-sm {
            padding: 4px 6px;
            font-size: 0.7rem;
            width: auto;
            border-radius: 2px;
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        .btn i {
            font-size: 0.7rem;
        }
        
        /* 功能列表样式 */
        .functions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .function-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: var(--border-radius);
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .function-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-color: var(--secondary-color);
        }
        
        .function-item i {
            font-size: 1.5rem;
            color: var(--secondary-color);
        }
        
        .function-item span {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--dark-color);
        }
        
        .function-item .description {
            font-size: 0.7rem;
            color: var(--gray-color);
            margin-top: 2px;
        }
        
        /* 状态指示器 */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
            background-color: #e8f4fc;
            color: var(--secondary-color);
        }
        
        .status-indicator.active {
            background-color: #e7f6ec;
            color: var(--accent-color);
        }
        
        /* 学习进度条 */
        .progress-bar {
            height: 6px;
            background-color: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary-color) 0%, var(--accent-color) 100%);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        
        /* 单词卡片 */
        .word-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: var(--border-radius);
            padding: 12px;
            margin-bottom: 8px;
            border-left: 3px solid var(--secondary-color);
        }
        
        .word-card .word {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--primary-color);
        }
        
        .word-card .phonetic {
            font-size: 0.75rem;
            color: var(--gray-color);
            margin: 2px 0;
        }
        
        .word-card .meaning {
            font-size: 0.8rem;
            color: var(--dark-color);
        }
        
        /* 响应式调整 */
        @media (max-width: 480px) {
            .functions-grid {
                grid-template-columns: 1fr;
            }
        }
        
        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid var(--secondary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 工具提示 */
        .tooltip {
            position: relative;
            display: inline-block;
        }
        
        .tooltip .tooltip-text {
            visibility: hidden;
            background-color: var(--dark-color);
            color: white;
            text-align: center;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.7rem;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }
        
        .tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部标题栏 -->
        <header class="app-header">
            <div class="app-title">
                <i class="fas fa-language"></i>
                隆莱英语学习助手
            </div>
            <div class="word-count">
                <span id="wordCount">0</span> 词
            </div>
        </header>
        
        <!-- 选项卡导航 -->
        <nav class="tab-nav">
            <button class="tab-button active" data-tab="home">
                <i class="fas fa-home"></i> 首页
            </button>
            <button class="tab-button" data-tab="words">
                <i class="fas fa-book"></i> 单词库
            </button>
            <button class="tab-button" data-tab="practice">
                <i class="fas fa-pen-alt"></i> 练习
            </button>
            <button class="tab-button" data-tab="progress">
                <i class="fas fa-chart-line"></i> 统计
            </button>
        </nav>
        
        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 首页选项卡 -->
            <div id="home" class="tab-content active">
                <div class="card">
                    <div class="card-title">
                        <span><i class="fas fa-rocket"></i> 快速开始</span>
                        <div class="status-indicator active">
                            <i class="fas fa-circle"></i> 在线
                        </div>
                    </div>
                    
                    <div class="functions-grid">
                        <div class="function-item" onclick="showTab('words')">
                            <i class="fas fa-plus-circle"></i>
                            <span>添加单词</span>
                            <div class="description">添加新单词到学习库</div>
                        </div>
                        
                        <div class="function-item" onclick="showTab('practice')">
                            <i class="fas fa-pen-alt"></i>
                            <span>练习测试</span>
                            <div class="description">巩固已学单词</div>
                        </div>
                        
                        <div class="function-item" onclick="showWeeklyPlan()">
                            <i class="fas fa-calendar-alt"></i>
                            <span>每周学习计划</span>
                            <div class="description">制定学习计划</div>
                        </div>
                        
                        <div class="function-item" onclick="showKnowledgeBase()">
                            <i class="fas fa-brain"></i>
                            <span>博普智库</span>
                            <div class="description">学习资源库</div>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-chart-bar"></i> 学习进度
                    </div>
                    
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px;">
                            <span>今日进度</span>
                            <span id="todayProgress">0/10</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
                            <span>本周已学单词</span>
                            <span id="weeklyWords">0</span>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-lightbulb"></i> 今日单词推荐
                    </div>
                    
                    <div id="dailyWord">
                        <div class="word-card">
                            <div class="word">Welcome</div>
                            <div class="phonetic">/ˈwelkəm/</div>
                            <div class="meaning">v. 欢迎；迎接 n. 欢迎；迎接 adj. 受欢迎的</div>
                        </div>
                    </div>
                    
                    <button class="btn btn-primary" onclick="getNewWord()">
                        <i class="fas fa-redo"></i> 换一个单词
                    </button>
                </div>
            </div>
            
            <!-- 单词库选项卡 -->
            <div id="words" class="tab-content">
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-book"></i> 单词管理
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">添加新单词</label>
                        <input type="text" class="form-input" id="newWord" placeholder="输入英文单词">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">音标（可选）</label>
                        <input type="text" class="form-input" id="wordPhonetic" placeholder="例如：/ˈæpl/">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">中文释义</label>
                        <input type="text" class="form-input" id="wordMeaning" placeholder="输入单词的中文意思">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">难度等级</label>
                        <select class="form-select" id="wordLevel">
                            <option value="1">初级</option>
                            <option value="2" selected>中级</option>
                            <option value="3">高级</option>
                        </select>
                    </div>
                    
                    <button class="btn btn-success" onclick="addWord()">
                        <i class="fas fa-plus"></i> 添加单词
                    </button>
                </div>
                
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-list"></i> 单词列表
                    </div>
                    
                    <div id="wordList">
                        <div class="word-card">
                            <div class="word">Apple</div>
                            <div class="phonetic">/ˈæpl/</div>
                            <div class="meaning">n. 苹果；苹果公司</div>
                            <div style="margin-top: 5px; display: flex; gap: 5px;">
                                <button class="btn btn-sm btn-secondary" onclick="editWord(this)">编辑</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteWord(this)">删除</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 练习选项卡 -->
            <div id="practice" class="tab-content">
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-pen-alt"></i> 练习模式
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">选择练习类型</label>
                        <select class="form-select" id="practiceType">
                            <option value="meaning">词义选择</option>
                            <option value="spelling">拼写练习</option>
                            <option value="listening">听力练习</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">单词数量</label>
                        <select class="form-select" id="wordCountSelect">
                            <option value="5">5个单词</option>
                            <option value="10" selected>10个单词</option>
                            <option value="15">15个单词</option>
                            <option value="20">20个单词</option>
                        </select>
                    </div>
                    
                    <button class="btn btn-primary" onclick="startPractice()">
                        <i class="fas fa-play"></i> 开始练习
                    </button>
                    
                    <div id="practiceArea" style="display: none; margin-top: 15px;">
                        <div class="card">
                            <div class="card-title" id="practiceQuestion">
                                问题将在这里显示
                            </div>
                            
                            <div id="practiceOptions" style="display: flex; flex-direction: column; gap: 8px;">
                                <!-- 选项将通过JS动态生成 -->
                            </div>
                            
                            <div style="margin-top: 15px; display: flex; justify-content: space-between;">
                                <span id="practiceProgress">0/0</span>
                                <button class="btn btn-sm btn-success" onclick="nextQuestion()" id="nextBtn" style="display: none;">
                                    下一题
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 统计选项卡 -->
            <div id="progress" class="tab-content">
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-chart-pie"></i> 学习统计
                    </div>
                    
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px;">
                        <div class="function-item" style="background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);">
                            <i class="fas fa-book" style="color: #1976d2;"></i>
                            <span id="totalWords">0</span>
                            <div class="description">总单词数</div>
                        </div>
                        
                        <div class="function-item" style="background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);">
                            <i class="fas fa-check-circle" style="color: #388e3c;"></i>
                            <span id="masteredWords">0</span>
                            <div class="description">已掌握</div>
                        </div>
                        
                        <div class="function-item" style="background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);">
                            <i class="fas fa-fire" style="color: #f57c00;"></i>
                            <span id="streakDays">0</span>
                            <div class="description">连续学习</div>
                        </div>
                        
                        <div class="function-item" style="background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);">
                            <i class="fas fa-clock" style="color: #7b1fa2;"></i>
                            <span id="studyTime">0</span>
                            <div class="description">学习时间(小时)</div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">本周学习趋势</label>
                        <div style="height: 150px; background-color: #f8f9fa; border-radius: var(--border-radius); padding: 10px; display: flex; align-items: flex-end; gap: 8px; justify-content: space-around;">
                            <div style="display: flex; flex-direction: column; align-items: center;">
                                <div class="progress-bar" style="height: 100px; width: 20px;">
                                    <div class="progress-fill" style="width: 100%; height: 30%;"></div>
                                </div>
                                <span style="font-size: 0.7rem; margin-top: 5px;">一</span>
                            </div>
                            <!-- 其他日期类似，这里简略显示 -->
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-trophy"></i> 学习成就
                    </div>
                    
                    <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;">
                        <div style="text-align: center;">
                            <i class="fas fa-medal" style="font-size: 2rem; color: #ffd700;"></i>
                            <div style="font-size: 0.7rem; margin-top: 5px;">单词大师</div>
                        </div>
                        <div style="text-align: center;">
                            <i class="fas fa-star" style="font-size: 2rem; color: #c0c0c0;"></i>
                            <div style="font-size: 0.7rem; margin-top: 5px;">连续学习</div>
                        </div>
                        <div style="text-align: center;">
                            <i class="fas fa-bolt" style="font-size: 2rem; color: #cd7f32;"></i>
                            <div style="font-size: 0.7rem; margin-top: 5px;">快速学习者</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        // 初始化数据
        let wordCount = 0;
        let todayProgress = 0;
        let weeklyWords = 0;
        
        // 初始化函数
        function initApp() {
            // 从本地存储加载数据
            const savedWordCount = localStorage.getItem('wordCount');
            const savedProgress = localStorage.getItem('todayProgress');
            const savedWeeklyWords = localStorage.getItem('weeklyWords');
            
            wordCount = savedWordCount ? parseInt(savedWordCount) : 0;
            todayProgress = savedProgress ? parseInt(savedProgress) : 0;
            weeklyWords = savedWeeklyWords ? parseInt(savedWeeklyWords) : 0;
            
            // 更新UI
            updateUI();
            
            // 设置默认选项卡
            showTab('home');
        }
        
        // 更新UI显示
        function updateUI() {
            document.getElementById('wordCount').textContent = wordCount;
            document.getElementById('todayProgress').textContent = `${todayProgress}/10`;
            document.getElementById('progressFill').style.width = `${(todayProgress/10)*100}%`;
            document.getElementById('weeklyWords').textContent = weeklyWords;
            
            // 更新统计页面
            document.getElementById('totalWords').textContent = wordCount;
            document.getElementById('masteredWords').textContent = Math.floor(wordCount * 0.7);
            document.getElementById('streakDays').textContent = todayProgress > 0 ? '3' : '0';
            document.getElementById('studyTime').textContent = Math.floor(wordCount * 0.5);
        }
        
        // 显示指定选项卡
        function showTab(tabId) {
            // 隐藏所有选项卡内容
            const tabContents = document.querySelectorAll('.tab-content');
            tabContents.forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 移除所有选项卡按钮的激活状态
            const tabButtons = document.querySelectorAll('.tab-button');
            tabButtons.forEach(button => {
                button.classList.remove('active');
            });
            
            // 显示选中的选项卡内容
            document.getElementById(tabId).classList.add('active');
            
            // 激活对应的选项卡按钮
            const activeButton = document.querySelector(`[data-tab="${tabId}"]`);
            if (activeButton) {
                activeButton.classList.add('active');
            }
        }
        
        // 添加单词
        function addWord() {
            const newWord = document.getElementById('newWord').value.trim();
            const phonetic = document.getElementById('wordPhonetic').value.trim();
            const meaning = document.getElementById('wordMeaning').value.trim();
            const level = document.getElementById('wordLevel').value;
            
            if (!newWord || !meaning) {
                alert('请填写单词和释义');
                return;
            }
            
            // 创建单词卡片
            const wordCard = document.createElement('div');
            wordCard.className = 'word-card';
            wordCard.innerHTML = `
                <div class="word">${newWord}</div>
                <div class="phonetic">${phonetic || '/暂无音标/'}</div>
                <div class="meaning">${meaning}</div>
                <div style="margin-top: 5px; display: flex; gap: 5px;">
                    <button class="btn btn-sm btn-secondary" onclick="editWord(this)">编辑</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteWord(this)">删除</button>
                </div>
            `;
            
            // 添加到单词列表
            document.getElementById('wordList').prepend(wordCard);
            
            // 更新计数
            wordCount++;
            todayProgress = Math.min(todayProgress + 1, 10);
            weeklyWords++;
            
            // 保存到本地存储
            localStorage.setItem('wordCount', wordCount);
            localStorage.setItem('todayProgress', todayProgress);
            localStorage.setItem('weeklyWords', weeklyWords);
            
            // 更新UI
            updateUI();
            
            // 清空输入框
            document.getElementById('newWord').value = '';
            document.getElementById('wordPhonetic').value = '';
            document.getElementById('wordMeaning').value = '';
            
            // 显示成功消息
            alert('单词添加成功！');
        }
        
        // 编辑单词
        function editWord(button) {
            const wordCard = button.closest('.word-card');
            const word = wordCard.querySelector('.word').textContent;
            const phonetic = wordCard.querySelector('.phonetic').textContent;
            const meaning = wordCard.querySelector('.meaning').textContent;
            
            const newWord = prompt('编辑单词：', word);
            const newPhonetic = prompt('编辑音标：', phonetic);
            const newMeaning = prompt('编辑释义：', meaning);
            
            if (newWord && newMeaning) {
                wordCard.querySelector('.word').textContent = newWord;
                wordCard.querySelector('.phonetic').textContent = newPhonetic || '/暂无音标/';
                wordCard.querySelector('.meaning').textContent = newMeaning;
                alert('单词编辑成功！');
            }
        }
        
        // 删除单词
        function deleteWord(button) {
            if (confirm('确定要删除这个单词吗？')) {
                const wordCard = button.closest('.word-card');
                wordCard.remove();
                
                // 更新计数
                wordCount = Math.max(wordCount - 1, 0);
                localStorage.setItem('wordCount', wordCount);
                updateUI();
            }
        }
        
        // 开始练习
        function startPractice() {
            const practiceType = document.getElementById('practiceType').value;
            const wordCount = parseInt(document.getElementById('wordCountSelect').value);
            
            // 显示练习区域
            document.getElementById('practiceArea').style.display = 'block';
            
            // 根据练习类型生成问题
            generatePracticeQuestion(practiceType, wordCount);
        }
        
        // 生成练习问题
        function generatePracticeQuestion(type, count) {
            const questionElement = document.getElementById('practiceQuestion');
            const optionsElement = document.getElementById('practiceOptions');
            const progressElement = document.getElementById('practiceProgress');
            const nextBtn = document.getElementById('nextBtn');
            
            // 清空选项
            optionsElement.innerHTML = '';
            
            // 根据类型生成问题
            let questionText = '';
            let options = [];
            
            if (type === 'meaning') {
                questionText = "单词 'Apple' 的中文意思是什么？";
                options = ['苹果', '香蕉', '橙子', '梨子'];
            } else if (type === 'spelling') {
                questionText = "请拼写单词：苹果";
                options = ['Apple', 'Aple', 'Appel', 'Aplle'];
            } else if (type === 'listening') {
                questionText = "请选择你听到的单词";
                options = ['Apple', 'Banana', 'Orange', 'Grape'];
            }
            
            questionElement.textContent = questionText;
            
            // 生成选项按钮
            options.forEach((option, index) => {
                const optionButton = document.createElement('button');
                optionButton.className = 'btn';
                optionButton.style.backgroundColor = '#f8f9fa';
                optionButton.style.color = var('--dark-color');
                optionButton.style.border = '1px solid #dee2e6';
                optionButton.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
                optionButton.onclick = function() {
                    // 检查答案
                    const isCorrect = index === 0; // 假设第一个选项是正确答案
                    
                    if (isCorrect) {
                        this.style.backgroundColor = '#d4edda';
                        this.style.color = '#155724';
                        this.style.borderColor = '#c3e6cb';
                        nextBtn.style.display = 'block';
                    } else {
                        this.style.backgroundColor = '#f8d7da';
                        this.style.color = '#721c24';
                        this.style.borderColor = '#f5c6cb';
                    }
                };
                
                optionsElement.appendChild(optionButton);
            });
            
            progressElement.textContent = `1/${count}`;
            nextBtn.style.display = 'none';
        }
        
        // 下一题
        function nextQuestion() {
            // 这里可以添加逻辑来生成下一题
            alert('这是最后一题了！练习完成。');
        }
        
        // 获取新单词
        function getNewWord() {
            const words = [
                {word: 'Perseverance', phonetic: '/ˌpɜːsɪˈvɪərəns/', meaning: 'n. 毅力；坚持不懈'},
                {word: 'Eloquent', phonetic: '/ˈeləkwənt/', meaning: 'adj. 雄辩的；有说服力的'},
                {word: 'Ubiquitous', phonetic: '/juːˈbɪkwɪtəs/', meaning: 'adj. 无处不在的'},
                {word: 'Serendipity', phonetic: '/ˌserənˈdɪpəti/', meaning: 'n. 意外发现珍奇事物的本领'},
                {word: 'Ephemeral', phonetic: '/ɪˈfemərəl/', meaning: 'adj. 短暂的；瞬息的'}
            ];
            
            const randomWord = words[Math.floor(Math.random() * words.length)];
            
            document.getElementById('dailyWord').innerHTML = `
                <div class="word-card">
                    <div class="word">${randomWord.word}</div>
                    <div class="phonetic">${randomWord.phonetic}</div>
                    <div class="meaning">${randomWord.meaning}</div>
                </div>
            `;
        }
        
        // 显示每周计划
        function showWeeklyPlan() {
            alert('每周学习计划功能开发中...');
        }
        
        // 显示知识库
        function showKnowledgeBase() {
            alert('博普智库功能开发中...');
        }
        
        // 选项卡按钮点击事件
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化应用
            initApp();
            
            // 为选项卡按钮添加点击事件
            const tabButtons = document.querySelectorAll('.tab-button');
            tabButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const tabId = this.getAttribute('data-tab');
                    showTab(tabId);
                });
            });
        });
    </script>
</body>
</html>
